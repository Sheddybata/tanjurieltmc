version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tanjuriel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanjuriel
      POSTGRES_PASSWORD: tanjuriel_dev
      POSTGRES_DB: tanjuriel_mfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanjuriel -d tanjuriel_mfi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tanjuriel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
