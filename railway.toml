[build]
builder = "nixpacks"
buildCommand = "npm ci --include=dev && npm run db:generate && npm run build --workspace=@tanjuriel/database && npm run build --workspace=@tanjuriel/api && npm run db:migrate:deploy"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/api/docs"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
