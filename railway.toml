# API service only — admin web deploys on Vercel.
# Railway service settings: Root Directory must be empty (repo root).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/apps/api/**",
  "/packages/database/**",
  "/packages/shared/**",
  "/package.json",
  "/package-lock.json",
  "/Dockerfile",
  "/scripts/**",
]

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
