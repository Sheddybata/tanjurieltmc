[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run db:generate && npm run build --workspace=@tanjuriel/database && npm run build --workspace=@tanjuriel/api"

[deploy]
startCommand = "npm run db:migrate:deploy && node apps/api/dist/main.js"
healthcheckPath = "/api/docs"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
